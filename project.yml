name: Geomap
options:
  bundleIdPrefix: com.geomap
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
configs:
  Debug: debug
  Release: release
configFiles:
  Debug: Config/Shared.xcconfig
  Release: Config/Shared.xcconfig
targets:
  Geomap:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Geomap
    info:
      path: Geomap/App/Info.plist
      properties:
        UILaunchScreen: {}
        NSLocationWhenInUseUsageDescription: "Geomap uses your location to show you on the map and find nearby friends."
        GeomapAPIBaseURL: $(GEOMAP_API_BASE_URL)
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        NSLocalNetworkUsageDescription: "Geomap uses the local network to find the friend you are adding who is right next to you."
        NSBonjourServices:
          - _geomap-friend._tcp
          - _geomap-friend._udp
        UIBackgroundModes:
          - location
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(GEOMAP_BUNDLE_ID)
        MARKETING_VERSION: "0.1.0-SNAPSHOT"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    scheme:
      testTargets:
        - GeomapTests
      config: Debug
  GeomapTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: GeomapTests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.geomap.ios.tests
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: Geomap
    scheme:
      testTargets:
        - GeomapTests
      config: Debug
